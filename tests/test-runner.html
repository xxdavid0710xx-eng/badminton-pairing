<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Unit Tests</title>
  <style>
    body { font-family: monospace; background: #0f172a; color: #e2e8f0; padding: 20px; }
    .pass { color: #34d399; }
    .fail { color: #f87171; }
    pre  { background: #1e293b; padding: 8px; border-radius: 4px; margin: 4px 0; }

<body>
<h2>🏸 Unit Tests</h2>
<div id="results"></div>
<script type="module">
  import { buildWaitingQueue } from '../js/queue.js';
  import { effectiveLevel, findBestMatch } from '../js/matching.js';

  const results = document.getElementById('results');
  let passed = 0, failed = 0;

  function test(name, fn) {
    try {
      fn();
      results.innerHTML += `<p class="pass">✓ ${name}</p>`;
      passed++;
    } catch (e) {
      results.innerHTML += `<p class="fail">✗ ${name}</p><pre>${e.message}</pre>`;
      failed++;
    }
  }
  function assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }
  function assertEqual(a, b) { if (a !== b) throw new Error(`expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`); }

  // QUEUE TESTS (from Task 4)

  const now = Date.now();
  const mkP = (id, games, lastEnd, isPresent = true) => ({
    id, name: id, skillLevel: 5, gamesPlayed: games,
    isPresent, pendingLeave: false,
    lastGameEndTime: lastEnd ? new Date(lastEnd).toISOString() : null,
    wins: 0, losses: 0,
  });

  test('queue: 場數少的排前面', () => {
    const players = [mkP('B', 3, now - 1000), mkP('A', 1, now - 2000)];
    const q = buildWaitingQueue(players, []);
    assertEqual(q[0].id, 'A');
  });

  test('queue: 場數相同時等待久的排前面', () => {
    const players = [mkP('B', 2, now - 1000), mkP('A', 2, now - 5000)];
    const q = buildWaitingQueue(players, []);
    assertEqual(q[0].id, 'A');
  });

  test('queue: 從未打過的場數為 0，lastGameEndTime=null 排最前', () => {
    const players = [mkP('B', 1, now - 1000), mkP('A', 0, null)];
    const q = buildWaitingQueue(players, []);
    assertEqual(q[0].id, 'A');
  });

  test('queue: 在場上的人不出現在等待區', () => {
    const players = [mkP('A', 0, null), mkP('B', 0, null)];
    const q = buildWaitingQueue(players, ['A']);
    assertEqual(q.length, 1);
    assertEqual(q[0].id, 'B');
  });

  test('queue: isPresent=false 的人不出現', () => {
    const players = [mkP('A', 0, null, false), mkP('B', 0, null, true)];
    const q = buildWaitingQueue(players, []);
    assertEqual(q.length, 1);
  });

  test('queue: pendingLeave 的人不出現', () => {
    const players = [
      { ...mkP('A', 0, null), pendingLeave: true },
      mkP('B', 0, null),
    ];
    const q = buildWaitingQueue(players, []);
    assertEqual(q.length, 1);
    assertEqual(q[0].id, 'B');
  });

  // MATCHING TESTS (from Task 5)
  const mkPlayer = (id, skill, games = 0, wins = 0) => ({
    id, name: id, skillLevel: skill, gamesPlayed: games, wins,
    losses: games - wins, isPresent: true, pendingLeave: false, lastGameEndTime: null,
  });

  test('effectiveLevel: 場數不足 5 場無修正', () => {
    const p = mkPlayer('A', 10, 4, 4);
    assertEqual(effectiveLevel(p), 10);
  });

  test('effectiveLevel: 勝率 > 75% 加 1', () => {
    const p = mkPlayer('A', 10, 10, 9);
    assertEqual(effectiveLevel(p), 11);
  });

  test('effectiveLevel: 勝率 60-75% 加 0.5', () => {
    const p = mkPlayer('A', 10, 10, 7);
    assertEqual(effectiveLevel(p), 10.5);
  });

  test('effectiveLevel: 勝率 < 40% 減 0.5', () => {
    const p = mkPlayer('A', 10, 10, 3);
    assertEqual(effectiveLevel(p), 9.5);
  });

  test('findBestMatch: 回傳最均衡組合', () => {
    const players = [
      mkPlayer('A', 20), mkPlayer('B', 15),
      mkPlayer('C', 10), mkPlayer('D', 5),
    ];
    const match = findBestMatch(players);
    assert(match !== null, 'match should not be null');
    const avg1 = (match.team1[0].skillLevel + match.team1[1].skillLevel) / 2;
    const avg2 = (match.team2[0].skillLevel + match.team2[1].skillLevel) / 2;
    assertEqual(avg1, avg2);
  });

  test('findBestMatch: 人數不足回傳 null', () => {
    const players = [mkPlayer('A', 10), mkPlayer('B', 8), mkPlayer('C', 6)];
    assert(findBestMatch(players) === null, 'should return null');
  });

  // PLAYERS.JS TESTS
  // (markLeave tests run with mock storage — use direct logic check)
  test('markLeave: player not on court → isPresent becomes false', () => {
    // markLeave logic: if NOT in onCourtIds → isPresent:false, pendingLeave:false
    const onCourt = ['court1', 'court2'];
    const playerId = 'player-A';
    const isOnCourt = onCourt.includes(playerId);
    assert(!isOnCourt, 'player should not be on court');
    // Expected result object fields
    const result = isOnCourt
      ? { pendingLeave: true }
      : { isPresent: false, pendingLeave: false };
    assertEqual(result.isPresent, false);
    assertEqual(result.pendingLeave, false);
  });

  test('markLeave: player on court → pendingLeave becomes true', () => {
    const onCourt = ['player-B'];
    const playerId = 'player-B';
    const isOnCourt = onCourt.includes(playerId);
    assert(isOnCourt, 'player should be on court');
    const result = isOnCourt
      ? { pendingLeave: true }
      : { isPresent: false, pendingLeave: false };
    assertEqual(result.pendingLeave, true);
  });

  test('findBestMatch: win-rate bonus influences team composition', () => {
    // Two players have same skillLevel=10, but player A has 90% win-rate (gets +1.0 bonus = 11)
    // Two players have skillLevel=10 with <5 games (no bonus = 10)
    // Best balanced match: high-win-rate + low vs neutral + neutral
    const pHighWin = mkPlayer('HW', 10, 10, 9);  // winRate 90% → effectiveLevel 11
    const pNeutral1 = mkPlayer('N1', 10, 0, 0);   // no games → effectiveLevel 10
    const pNeutral2 = mkPlayer('N2', 10, 0, 0);   // no games → effectiveLevel 10
    const pLow =      mkPlayer('LW', 9, 0, 0);    // skillLevel 9 → effectiveLevel 9

    // Possible splits of [HW(11), N1(10), N2(10), LW(9)]:
    // [HW+LW=10] vs [N1+N2=10] → diff=0  (best)
    // [HW+N1=10.5] vs [N2+LW=9.5] → diff=1
    // [HW+N2=10.5] vs [N1+LW=9.5] → diff=1
    const match = findBestMatch([pHighWin, pNeutral1, pNeutral2, pLow]);
    assert(match !== null, 'match should not be null');
    assert(match.diff === 0, `expected diff=0, got diff=${match.diff}`);
    // Verify HW is paired with LW
    const hwInTeam1 = match.team1.some(p => p.id === 'HW');
    const lwInTeam1 = match.team1.some(p => p.id === 'LW');
    const hwInTeam2 = match.team2.some(p => p.id === 'HW');
    const lwInTeam2 = match.team2.some(p => p.id === 'LW');
    assert(
      (hwInTeam1 && lwInTeam1) || (hwInTeam2 && lwInTeam2),
      'HW and LW should be on the same team for balance'
    );
  });

  results.innerHTML += `<p style="margin-top:16px;font-weight:bold">${passed} passed, ${failed} failed</p>`;
</script>

<script type="module">
import { createPlayer, createSession } from '../js/data.js';

const results = document.getElementById('results');
let passed = 0, failed = 0;

function test(name, fn) {
  try {
    fn();
    results.innerHTML += `<p class="pass">✓ ${name}</p>`;
    passed++;
  } catch (e) {
    results.innerHTML += `<p class="fail">✗ ${name}</p><pre>${e.message}</pre>`;
    failed++;
  }
}
function assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }
function assertEqual(a, b) { if (a !== b) throw new Error(`expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`); }

// ── Data model v2 tests ──
test('createPlayer v2: gender 預設 M', () => {
  const p = createPlayer('測試', 10);
  assertEqual(p.gender, 'M');
});
test('createPlayer v2: matchPreference 預設 any', () => {
  const p = createPlayer('測試', 10);
  assertEqual(p.matchPreference, 'any');
});
test('createPlayer v2: partners 是空陣列', () => {
  const p = createPlayer('測試', 10);
  assert(Array.isArray(p.partners), 'partners should be array');
  assertEqual(p.partners.length, 0);
});
test('createPlayer v2: avoidTeam 是空陣列', () => {
  const p = createPlayer('測試', 10);
  assert(Array.isArray(p.avoidTeam), 'avoidTeam should be array');
});
test('createPlayer v2: avoidAll 是空陣列', () => {
  const p = createPlayer('測試', 10);
  assert(Array.isArray(p.avoidAll), 'avoidAll should be array');
});
test('createPlayer v2: manualQueuePosition 預設 null', () => {
  const p = createPlayer('測試', 10);
  assertEqual(p.manualQueuePosition, null);
});
test('createPlayer v2: 保留既有欄位', () => {
  const p = createPlayer('測試', 10);
  assertEqual(p.skillLevel, 10);
  assertEqual(p.gamesPlayed, 0);
  assertEqual(p.isPresent, false);
  assert(typeof p.id === 'string', 'id should be string');
});
test('createSession: date 正確', () => {
  const s = createSession('2026-06-11');
  assertEqual(s.date, '2026-06-11');
});
test('createSession: slots 是空陣列', () => {
  const s = createSession('2026-06-11');
  assert(Array.isArray(s.slots), 'slots should be array');
  assertEqual(s.slots.length, 0);
});
test('createSession: playerSlots 是物件', () => {
  const s = createSession('2026-06-11');
  assert(typeof s.playerSlots === 'object' && !Array.isArray(s.playerSlots), 'playerSlots should be object');
});
test('createSession: payments 是物件', () => {
  const s = createSession('2026-06-11');
  assert(typeof s.payments === 'object' && !Array.isArray(s.payments), 'payments should be object');
});
test('createSession: discounts 是物件', () => {
  const s = createSession('2026-06-11');
  assert(typeof s.discounts === 'object' && !Array.isArray(s.discounts), 'discounts should be object');
});
test('createSession: 有唯一 id', () => {
  const s1 = createSession('2026-06-11');
  const s2 = createSession('2026-06-11');
  assert(typeof s1.id === 'string' && s1.id.length > 0, 'id should be non-empty string');
  assert(s1.id !== s2.id, 'each session should have unique id');
});

results.innerHTML += `<p style="margin-top:8px;font-weight:bold;color:#94a3b8">資料模型 v2：${passed} passed, ${failed} failed</p>`;
</script>

<script type="module">
const results = document.getElementById('results');
let passed = 0, failed = 0;

function test(name, fn) {
  try {
    fn();
    results.innerHTML += `<p class="pass">✓ ${name}</p>`;
    passed++;
  } catch (e) {
    results.innerHTML += `<p class="fail">✗ ${name}</p><pre>${e.message}</pre>`;
    failed++;
  }
}
function assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }
function assertEqual(a, b) { if (a !== b) throw new Error(`expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`); }

// migratePlayer logic (pure function test — no localStorage needed)
function migratePlayer(p) {
  return {
    gender: 'M',
    matchPreference: 'any',
    partners: [],
    avoidTeam: [],
    avoidAll: [],
    manualQueuePosition: null,
    ...p,
  };
}

test('migratePlayer: 補齊 gender 預設 M', () => {
  const old = { id: 'x', name: '舊球員', skillLevel: 5, gamesPlayed: 3,
                wins: 1, losses: 2, isPresent: false, pendingLeave: false,
                lastGameEndTime: null };
  const m = migratePlayer(old);
  assertEqual(m.gender, 'M');
});

test('migratePlayer: 補齊 matchPreference 預設 any', () => {
  const old = { id: 'x', name: '舊球員', skillLevel: 5, gamesPlayed: 0,
                wins: 0, losses: 0, isPresent: false, pendingLeave: false,
                lastGameEndTime: null };
  const m = migratePlayer(old);
  assertEqual(m.matchPreference, 'any');
});

test('migratePlayer: 補齊 partners 空陣列', () => {
  const old = { id: 'x', name: '舊球員', skillLevel: 5, gamesPlayed: 0,
                wins: 0, losses: 0, isPresent: false, pendingLeave: false,
                lastGameEndTime: null };
  const m = migratePlayer(old);
  assert(Array.isArray(m.partners) && m.partners.length === 0, 'partners should be empty array');
});

test('migratePlayer: 補齊 manualQueuePosition null', () => {
  const old = { id: 'x', name: '舊球員', skillLevel: 5, gamesPlayed: 0,
                wins: 0, losses: 0, isPresent: false, pendingLeave: false,
                lastGameEndTime: null };
  const m = migratePlayer(old);
  assertEqual(m.manualQueuePosition, null);
});

test('migratePlayer: 原本欄位不被覆蓋', () => {
  const old = { id: 'x', name: '舊球員', skillLevel: 5, gamesPlayed: 3,
                wins: 1, losses: 2, isPresent: true, pendingLeave: false,
                lastGameEndTime: null };
  const m = migratePlayer(old);
  assertEqual(m.name, '舊球員');
  assertEqual(m.skillLevel, 5);
  assertEqual(m.gamesPlayed, 3);
  assertEqual(m.isPresent, true);
});

test('migratePlayer: 已有 gender 欄位不被覆蓋', () => {
  const existing = { id: 'x', name: '小美', skillLevel: 8, gamesPlayed: 0,
                     wins: 0, losses: 0, isPresent: false, pendingLeave: false,
                     lastGameEndTime: null, gender: 'F' };
  const m = migratePlayer(existing);
  assertEqual(m.gender, 'F');
});

test('migratePlayer: 已有 partners 不被覆蓋', () => {
  const existing = { id: 'x', name: '小明', skillLevel: 10, gamesPlayed: 0,
                     wins: 0, losses: 0, isPresent: false, pendingLeave: false,
                     lastGameEndTime: null, partners: ['abc', 'def'] };
  const m = migratePlayer(existing);
  assertEqual(m.partners.length, 2);
  assertEqual(m.partners[0], 'abc');
});

results.innerHTML += `<p style="margin-top:8px;font-weight:bold;color:#94a3b8">Player migration：${passed} passed, ${failed} failed</p>`;
</script>

<script type="module">
import { calcPlayerAmount } from '../js/sessions.js';

const results = document.getElementById('results');
let passed = 0, failed = 0;

function test(name, fn) {
  try {
    fn();
    results.innerHTML += `<p class="pass">✓ ${name}</p>`;
    passed++;
  } catch (e) {
    results.innerHTML += `<p class="fail">✗ ${name}</p><pre>${e.message}</pre>`;
    failed++;
  }
}
function assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }
function assertEqual(a, b) { if (a !== b) throw new Error(`expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`); }

const sampleSession = {
  id: 'test-session',
  date: '2026-06-11',
  slots: [
    { label: '19-20', start: '19:00', end: '20:00', unitPrice: 80 },
    { label: '20-21', start: '20:00', end: '21:00', unitPrice: 80 },
    { label: '21-22', start: '21:00', end: '22:00', unitPrice: 80 },
  ],
  discounts: { 2: 140, 3: 190 },
  playerSlots: { 'p1': [0, 1], 'p2': [0], 'p3': [0, 1, 2] },
  payments: {},
};

test('calcPlayerAmount: 1 段無折扣 → 原價', () => {
  assertEqual(calcPlayerAmount(sampleSession, 'p2'), 80);
});

test('calcPlayerAmount: 2 段有折扣 → 折扣價 140', () => {
  assertEqual(calcPlayerAmount(sampleSession, 'p1'), 140);
});

test('calcPlayerAmount: 3 段有折扣 → 折扣價 190', () => {
  assertEqual(calcPlayerAmount(sampleSession, 'p3'), 190);
});

test('calcPlayerAmount: 未報名球員 → 0', () => {
  assertEqual(calcPlayerAmount(sampleSession, 'not-in-session'), 0);
});

test('calcPlayerAmount: 無折扣設定時段總和', () => {
  const noDiscount = { ...sampleSession, discounts: {} };
  assertEqual(calcPlayerAmount(noDiscount, 'p1'), 160); // 80+80
});

test('calcPlayerAmount: 空 playerSlots → 0', () => {
  const empty = { ...sampleSession, playerSlots: {} };
  assertEqual(calcPlayerAmount(empty, 'p1'), 0);
});

test('getAllSessions returns newest first (logic check)', () => {
  const arr = ['a', 'b', 'c'];
  const reversed = arr.slice().reverse();
  assertEqual(reversed[0], 'c');
  assertEqual(reversed[2], 'a');
  assert(arr[0] === 'a', 'original array untouched');
});

results.innerHTML += `<p style="margin-top:8px;font-weight:bold;color:#94a3b8">Sessions：${passed} passed, ${failed} failed</p>`;
</script>

<script type="module">
import { buildWaitingQueue, applyManualOrder } from '../js/queue.js';

const results = document.getElementById('results');
let passed = 0, failed = 0;

function test(name, fn) {
  try {
    fn();
    results.innerHTML += `<p class="pass">✓ ${name}</p>`;
    passed++;
  } catch (e) {
    results.innerHTML += `<p class="fail">✗ ${name}</p><pre>${e.message}</pre>`;
    failed++;
  }
}
function assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }
function assertEqual(a, b) { if (a !== b) throw new Error(`expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`); }

const make = (id, games, pos = null) => ({
  id, name: id, skillLevel: 5, gamesPlayed: games,
  isPresent: true, pendingLeave: false,
  lastGameEndTime: null, wins: 0, losses: 0,
  manualQueuePosition: pos,
});

// ── buildWaitingQueue with manualQueuePosition ──

test('queue v2: 有手動順序的排前面', () => {
  const players = [make('a', 0, null), make('b', 0, 0)];
  const q = buildWaitingQueue(players, []);
  assertEqual(q[0].id, 'b');
});

test('queue v2: 多個手動順序依 pos 排', () => {
  const players = [make('a', 0, null), make('b', 0, 2), make('c', 0, 0), make('d', 0, 1)];
  const q = buildWaitingQueue(players, []);
  assertEqual(q[0].id, 'c');
  assertEqual(q[1].id, 'd');
  assertEqual(q[2].id, 'b');
  assertEqual(q[3].id, 'a');
});

test('queue v2: 無手動順序時仍依場數排', () => {
  const players = [make('a', 3, null), make('b', 1, null)];
  const q = buildWaitingQueue(players, []);
  assertEqual(q[0].id, 'b');
});

test('queue v2: 混合手動與自動 — 手動排前面', () => {
  const players = [make('a', 0, null), make('b', 0, null), make('c', 0, 1)];
  const q = buildWaitingQueue(players, []);
  assertEqual(q[0].id, 'c');
});

// ── applyManualOrder ──

test('applyManualOrder: 依新順序設 pos', () => {
  const players = [make('a', 0), make('b', 0), make('c', 0)];
  const updated = applyManualOrder(players, ['c', 'a', 'b']);
  const aPlayer = updated.find(p => p.id === 'a');
  const bPlayer = updated.find(p => p.id === 'b');
  const cPlayer = updated.find(p => p.id === 'c');
  assertEqual(cPlayer.manualQueuePosition, 0);
  assertEqual(aPlayer.manualQueuePosition, 1);
  assertEqual(bPlayer.manualQueuePosition, 2);
});

test('applyManualOrder: 不在 orderedIds 的設為 null', () => {
  const players = [make('a', 0), make('b', 0), make('c', 0)];
  const updated = applyManualOrder(players, ['a', 'b']); // c not included
  const cPlayer = updated.find(p => p.id === 'c');
  assertEqual(cPlayer.manualQueuePosition, null);
});

test('applyManualOrder: 不修改原陣列', () => {
  const players = [make('a', 0), make('b', 0)];
  const original = players[0].manualQueuePosition;
  applyManualOrder(players, ['b', 'a']);
  assertEqual(players[0].manualQueuePosition, original); // original unchanged
});

results.innerHTML += `<p style="margin-top:8px;font-weight:bold;color:#94a3b8">Queue v2：${passed} passed, ${failed} failed</p>`;
</script>
</body>
</html>
